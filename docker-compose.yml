services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE LAYER
  # ---------------------------------------------------------------------------

  # 1. PostgreSQL (Metadata & MLflow Backend)
  db:
    image: postgres:15-alpine
    container_name: vid_analytics_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro # <-- เพิ่มบรรทัดนี้
    networks:
      - analytics_network

  # 2. Redis (Message Queue)
  redis:
    image: redis:7-alpine
    container_name: vid_analytics_queue
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - analytics_network

  # # 3. MinIO (Unified Object Storage - replaces Local Storage)
  minio:
    image: minio/minio
    container_name: vid_analytics_storage
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console Port
    volumes:
      - minio_data:/data
    networks:
      - analytics_network
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1" ]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 5s

  create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512MB
        reservations:
          cpus: '0.1'
          memory: 128MB
    networks:
      - analytics_network
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c " MAX_RETRIES=10; RETRY=0; until [ $$RETRY -eq $$MAX_RETRIES ]; do
        if /usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD 2>/dev/null; then
          echo 'MinIO connected';
          /usr/bin/mc mb myminio/video-frames --ignore-existing 2>/dev/null || true;
          /usr/bin/mc mb myminio/mlflow-bucket --ignore-existing 2>/dev/null || true;
          /usr/bin/mc anonymous set download myminio/video-frames 2>/dev/null || true;
          /usr/bin/mc anonymous set download myminio/mlflow-bucket 2>/dev/null || true;
          echo 'Buckets ready';
          exit 0;
        fi;
        RETRY=$$((RETRY+1));
        echo 'Retry' $$RETRY'/10...';
        sleep 1;
      done; echo 'Failed after' $$MAX_RETRIES 'attempts'; exit 1; "

  # 4. MinIO Setup (One-off task to create buckets automatically)
  # Commented out - ingestion.py creates buckets automatically if needed
  # createbuckets:
  #   image: minio/mc
  #   depends_on:
  #     - minio
  #   entrypoint: >
  #     /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; /usr/bin/mc mb myminio/raw-frames; /usr/bin/mc mb myminio/processed-images; /usr/bin/mc mb myminio/mlflow-models; /usr/bin/mc admin policy set myminio download public; exit 0; "
  #   networks:
  #     - analytics_network

  # 5. MLflow Tracking Server
  # Commented out - not needed for video ingestion testing
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: vid_analytics_mlflow
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3GB
        reservations:
          cpus: '0.5'
          memory: 1GB
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_S3_IGNORE_TLS: "true"
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow_db/mlflow.db --default-artifact-root s3://mlflow-bucket/ --artifacts-destination s3://mlflow-bucket/ --serve-artifacts --allowed-hosts "*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_db:/mlflow_db
    networks:
      - analytics_network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # APPLICATION LAYER (Your Custom Services)
  # ---------------------------------------------------------------------------

  # RTSP Camera Server (Stream MP4 files as RTSP)
  # rtsp-server:
  #   build: ./rtsp-camera
  #   container_name: rtsp_camera_server
  #   restart: unless-stopped
  #   ports:
  #     - "8554:8554"
  #   volumes:
  #     - ./rtsp-camera/test-vid:/app/videos:ro
  #   networks:
  #     - analytics_network
  #   healthcheck:
  #     test: [ "CMD-SHELL", "netstat -an | grep 8554 || exit 1" ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 10s

  # A. Video Ingestion Service (Multi-Camera Support)
  ingestion-service:
    build: ./ingestion
    container_name: vid_ingestion
    restart: "on-failure"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1GB
    depends_on:
      # rtsp-server:
      #   condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      # processing-worker:  # ✅ Wait for worker to be ready!
      #   condition: service_healthy
    environment:
      # Multi-camera format: camera_id:rtsp_url,camera_id:rtsp_url
      # If CAMERA_CONFIGS is empty, ingestion falls back to CAMERA_ID + VIDEO_FILE/RTSP_URL.
      CAMERA_CONFIGS: ${CAMERA_CONFIGS}
      CAMERA_ID: ${CAMERA_ID}
      VIDEO_FILE: ${VIDEO_FILE}
      RTSP_URL: ${RTSP_URL}

      # Redis configuration (External Server)
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: 0
      REDIS_QUEUE_NAME: frame_batches

      # MinIO configuration (External Server)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: video-frames
      MINIO_SECURE: "false"
    networks:
      - analytics_network
  # B. Processing Worker (Frame Processing & Database Writer)
  processing-worker:
    build: ./processing
    container_name: vid_processing_worker
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4GB
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    depends_on:
      mlflow-server:
        condition: service_healthy
      redis:
        condition: service_started
      db:
        condition: service_started
    healthcheck:
      # Check if Redis connection works AND Python process is running
      test: [ "CMD-SHELL", "python3 -c 'import redis; r=redis.Redis(host=\"redis\", port=6379, decode_responses=True); r.ping()' && pgrep -f python3 || exit 1" ]
      start_period: 30s
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: 0
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MODEL_URI: ${MODEL_URI}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_S3_IGNORE_TLS: true
      YOLO_AUTOINSTALL: "false"

    networks:
      - analytics_network
  dashboard:
    build: ./dashboard
    container_name: vid_dashboard
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512MB
    ports:
      - "8501:8501"
    depends_on:
      - db
      - minio
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      MINIO_BUCKET_NAME: video-frames
      SUPERSET_BASE_URL: http://localhost:8088
      SUPERSET_DASHBOARD_SLUG: mAEP2WNk8Z5
      SUPERSET_AUTO_REFRESH_SECONDS: ${SUPERSET_AUTO_REFRESH_SECONDS:-10}
    networks:
      - analytics_network

  # E. Apache Superset (BI Dashboard Platform)
  superset-postgres:
    image: postgres:15-alpine
    container_name: superset_db
    restart: always
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset123
      POSTGRES_DB: superset
    ports:
      - "5429:5432"
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    networks:
      - analytics_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  superset-init:
    build:
      context: ./superset-dockerfile
    image: superset-custom:latest
    container_name: superset_init
    restart: "no"
    depends_on:
      superset-postgres:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-1234567890abcdefghijklmnopqrstuvwxyz}
      SQLALCHEMY_DATABASE_URI: postgresql://superset:superset123@superset-postgres:5432/superset
      SUPERSET_SQLALCHEMY_DATABASE_URI: postgresql://superset:superset123@superset-postgres:5432/superset
      PYTHONUNBUFFERED: 1
    volumes:
      - superset_data:/var/lib/superset
      - ./superset-dockerfile/superset_config.py:/app/pythonpath/superset_config.py
    networks:
      - analytics_network
    command: >
      /bin/bash -c "
      superset db upgrade &&
      superset init &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.local --password admin123 || true &&
      echo 'Superset init complete!'
      "

  superset-import:
    build:
      context: ./superset-dockerfile
    image: superset-custom:latest
    container_name: superset_import
    restart: "no"
    depends_on:
      superset-postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    environment:
      FLASK_ENV: production
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-1234567890abcdefghijklmnopqrstuvwxyz}
      SQLALCHEMY_DATABASE_URI: postgresql://superset:superset123@superset-postgres:5432/superset
      SUPERSET_SQLALCHEMY_DATABASE_URI: postgresql://superset:superset123@superset-postgres:5432/superset
      PYTHONUNBUFFERED: 1
      SUPERSET_DATASET_EXPORT_PATH: ${SUPERSET_DATASET_EXPORT_PATH:-/imports/dataset_export_20260205T094311.zip}
      SUPERSET_DASHBOARD_EXPORT_PATH: ${SUPERSET_DASHBOARD_EXPORT_PATH:-/imports/dashboard_export_20260205T085329.zip}
      SUPERSET_IMPORT_USERNAME: ${SUPERSET_IMPORT_USERNAME:-admin}
      SUPERSET_ANALYTICS_DB_URI: ${SUPERSET_ANALYTICS_DB_URI:-postgresql://postgres:postgres1234@db:5432/vehicle_db}
      SUPERSET_DASHBOARD_SLUG: ${SUPERSET_DASHBOARD_SLUG:-AQW7bQEbaVn}
      SUPERSET_ALLOWED_EMBED_ORIGINS: ${SUPERSET_ALLOWED_EMBED_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
    volumes:
      - superset_data:/var/lib/superset
      - ./superset-dockerfile/superset_config.py:/app/pythonpath/superset_config.py
      - ./:/imports:ro
      - ./superset-dockerfile/import_superset_assets.sh:/app/import_superset_assets.sh:ro
    networks:
      - analytics_network
    command: >
      /bin/bash -c "
      /bin/sh /app/import_superset_assets.sh
      "

  superset:
    build:
      context: ./superset-dockerfile
    image: superset-custom:latest
    container_name: superset
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512MB
    depends_on:
      superset-postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
      superset-import:
        condition: service_completed_successfully
    environment:
      FLASK_ENV: production
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-1234567890abcdefghijklmnopqrstuvwxyz}
      SQLALCHEMY_DATABASE_URI: postgresql://superset:superset123@superset-postgres:5432/superset
      SUPERSET_SQLALCHEMY_DATABASE_URI: postgresql://superset:superset123@superset-postgres:5432/superset
      PYTHONUNBUFFERED: 1
    ports:
      - "8088:8088"
    volumes:
      - superset_data:/var/lib/superset
      - ./superset-dockerfile/superset_config.py:/app/pythonpath/superset_config.py
    networks:
      - analytics_network
    command: >
      /bin/bash -c "
      superset run -h 0.0.0.0 -p 8088 --with-threads
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      
  superset-api:
    build: ./superset-api
    container_name: superset_api
    restart: always
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_USER: admin
      SUPERSET_PASS: admin123
      SUPERSET_EMBEDDED_DASHBOARD_ID: ${SUPERSET_EMBEDDED_DASHBOARD_ID:-}
      SUPERSET_DASHBOARD_UUID: ${SUPERSET_DASHBOARD_UUID:-}
      SUPERSET_DASHBOARD_SLUG: ${SUPERSET_DASHBOARD_SLUG:-}
      SUPERSET_ALLOWED_EMBED_ORIGINS: ${SUPERSET_ALLOWED_EMBED_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
    ports:
      - "8000:8000"
    depends_on:
      superset:
        condition: service_healthy
    networks:
      - analytics_network

  deletion-service:
    build:
      context: ./processing
      dockerfile: Dockerfile.deletion
    container_name: vid_deletion_service
    command: python deletion_service.py
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
    networks:
      - analytics_network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512MB
  # ---------------------------------------------------------------------------
  # VOLUMES & NETWORKS
  # ---------------------------------------------------------------------------

networks:
  analytics_network:
    driver: bridge

volumes:
  db_data:
  minio_data:
  mlflow_db:
  superset_db_data:
  superset_data:
  redis_data: